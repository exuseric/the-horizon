<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results | THE HORIZON</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar scrolled">
        <div class="container">
            <a href="travel_recommendation.html" class="logo">THE <span>HORIZON</span></a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" style="display: none;">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div class="nav-links">
                <a href="travel_recommendation.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact Us</a>
            </div>
            <div class="nav-actions">
                <form id="searchForm" class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search horizons..." aria-label="Search destinations">
                    <button type="submit" class="btn-search">Search</button>
                </form>
                <button id="resetBtn" class="btn-reset">Reset</button>
            </div>
        </div>
    </nav>

    <main style="padding-top: 150px; min-height: 80vh;">
        <div class="container">
            <div class="grid-title">
                <div>
                    <span style="color: var(--gold); letter-spacing: 5px; text-transform: uppercase; font-size: 0.8rem; display: block; margin-bottom: 10px;">Collection</span>
                    <h2>Results for <span id="searchTerm">...</span></h2>
                </div>
                <p id="resultCount" style="max-width: 400px; font-size: 0.9rem; opacity: 0.7;"></p>
            </div>
            
            <div id="resultsGrid" class="results-grid">
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-grid">
                <div>
                    <div class="footer-logo">THE <span>HORIZON</span></div>
                    <p style="opacity: 0.6; font-size: 0.9rem; max-width: 300px;">A digital publication and travel concierge dedicated to the pursuit of extraordinary experiences.</p>
                </div>
                <div class="footer-links">
                    <h4>Navigation</h4>
                    <a href="travel_recommendation.html">Home</a>
                    <a href="about.html">About Us</a>
                    <a href="contact.html">Contact Us</a>
                </div>
                <div class="footer-links">
                    <h4>Support</h4>
                    <a href="contact.html">Member FAQ</a>
                    <a href="#">Privacy</a>
                </div>
            </div>
            <div style="margin-top: 60px; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; opacity: 0.5; text-align: center;">
                &copy; 2026 THE HORIZON. All Rights Reserved.
            </div>
        </div>
    </footer>

    <script src="travel_recommendation.js"></script>
</body>
</html>
